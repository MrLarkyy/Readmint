<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only the app's own scripts and styles run, nothing is fetched: a design is shown as an image. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' blob: data:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readmint editor</title>
    <link rel="stylesheet" href="/src/editor.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
