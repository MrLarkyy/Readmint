<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140" role="img"><defs><style>@keyframes k0{0%{transform:translate(0px,0px)}100%{transform:translate(160px,0px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.a0{animation:k0 1000ms linear infinite}@keyframes k1{0%{transform:translate(0px,0px);animation-timing-function:ease}100%{transform:translate(160px,0px)}}.a1{animation:k1 1000ms linear infinite}@keyframes k2{0%{transform:translate(0px,0px);animation-timing-function:ease-in-out}100%{transform:translate(160px,0px)}}.a2{animation:k2 1000ms linear infinite}@keyframes k3{0%{transform:translate(0px,0px);animation-timing-function:cubic-bezier(0.3,-0.6,0.7,1.6)}100%{transform:translate(160px,0px)}}.a3{animation:k3 1000ms linear infinite}@keyframes k4{0%{opacity:0.3;animation-timing-function:cubic-bezier(0.2,2,0.4,2)}100%{opacity:1}}.a4{animation:k4 1000ms linear infinite}@keyframes k5{0%{transform:translate(0px,0px);animation-timing-function:ease-in}50%{transform:translate(80px,0px);animation-timing-function:cubic-bezier(0,0,0.2,1)}100%{transform:translate(160px,0px)}}.a5{animation:k5 1000ms linear infinite}</style></defs><rect width="200" height="140" fill="#ffffff"/><g class="a0" transform="translate(0 0)"><rect x="10" y="10" width="20" height="20" fill="#1f6feb"/></g><g class="a1" transform="translate(0 0)"><rect x="10" y="36" width="20" height="20" fill="#1f6feb"/></g><g class="a2" transform="translate(0 0)"><rect x="10" y="62" width="20" height="20" fill="#1f6feb"/></g><g class="a3" transform="translate(0 0)"><rect x="10" y="88" width="20" height="20" fill="#1f6feb" opacity="0.3" class="a4"/></g><g class="a5" transform="translate(0 0)"><rect x="10" y="114" width="20" height="20" fill="#bf3989"/></g></svg>