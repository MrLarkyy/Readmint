<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img"><title>Profile banner</title><desc>A wide banner with the account name in a display font, the bio under it and a gradient backdrop, light or dark through the theme prop. The headline uses the font asset `display`: replace its src, family and licence in assets.fonts.display (and keep embedding allowed only for a font whose licence permits it) to set the banner in your own font.</desc><defs><style>@font-face{font-family:&quot;Montserrat&quot;;src:url(data:font/woff;sha256=88900ea81f46ccf9ba982bce50465e87a21728cc9d21f1e850592c59b08757ad);font-weight:800;font-style:normal}@font-face{font-family:&quot;Montserrat&quot;;src:url(data:font/woff;sha256=48253c7a3e6f8a820d8b91b48d66dd9d054c6d940387e4cedd77a4e10b355a10);font-weight:500;font-style:normal}</style><linearGradient id="id0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ddf4ff"/></linearGradient><linearGradient id="id1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(776 0 0 33.6 32 30)" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0969da"/><stop offset="1" stop-color="#8250df"/></linearGradient></defs><g><rect x="0.5" y="0.5" width="839" height="159" rx="12" fill="url(#id0)" stroke="#d0d7de" stroke-width="1"/><ellipse cx="740" cy="60" rx="100" ry="100" fill="#0969da" opacity="0.12"/><ellipse cx="795" cy="135" rx="75" ry="75" fill="#8250df" opacity="0.12"/><ellipse cx="625" cy="135" rx="45" ry="45" fill="#1a7f37" opacity="0.12"/><text xml:space="preserve" text-rendering="geometricPrecision" font-family="&#39;Montserrat&#39;" font-weight="800" font-size="28" fill="url(#id1)"><tspan x="32 66.152 100.304 134.456 168.608 202.76 236.912 271.064 305.216 339.368 373.52 407.672 441.824 475.976 510.128 544.28 578.432 612.584 646.736 680.888 715.04 748.1" y="56.838">WWWWWWWWWWWWWWWWWWWWW…</tspan></text><text xml:space="preserve" text-rendering="geometricPrecis