<svg xmlns="http://www.w3.org/2000/svg" width="840" height="160" viewBox="0 0 840 160" role="img"><title>Profile banner</title><desc>A wide banner with the account name in a display font, the bio under it and a gradient backdrop, light or dark through the theme prop. The headline uses the font asset `display`: replace its src, family and licence in assets.fonts.display (and keep embedding allowed only for a font whose licence permits it) to set the banner in your own font.</desc><defs><style>@font-face{font-family:&quot;Montserrat&quot;;src:url(data:font/woff;sha256=c3cdc80b4e90eeaadd65baa66e64b6c6a98ae415236cad35ba727f8b46f80f3a);font-weight:800;font-style:normal}@font-face{font-family:&quot;Montserrat&quot;;src:url(data:font/woff;sha256=3067bc1ed31cfdf7ea3e21ae22968187d1d507b79022faa5f6a63a7ba352006d);font-weight:500;font-style:normal}</style><linearGradient id="id0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/></linearGradient><linearGradient id="id1" gradientUnits="userSpaceOnUse" gradientTransform="matrix(776 0 0 43.2 32 30)" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#bc8cff"/></linearGradient></defs><g><rect x="0.5" y="0.5" width="839" height="159" rx="12" fill="url(#id0)" stroke="#30363d" stroke-width="1"/><ellipse cx="740" cy="60" rx="100" ry="100" fill="#4493f8" opacity="0.12"/><ellipse cx="795" cy="135" rx="75" ry="75" fill="#bc8cff" opacity="0.12"/><ellipse cx="625" cy="135" rx="45" ry="45" fill="#3fb950" opacity="0.12"/><text xml:space="preserve" text-rendering="geometricPrecision" font-family="&#39;Montserrat&#39;" font-weight="800" font-size="36" fill="url(#id1)"><tspan x="32 56.292 79.9 118.52 144.54 156.808 180.92 192.396 223.132 246.884 269.664 293.776 306.044 331.02 357.04 381.152" y="64.506">Sample Developer</tspan></text><text xml:space="preserve" text-rendering="geometricPrecision" font-family="&#39;Montserrat&#39;" font-weight="500" font-size="16" fill="#9198a1"><tspan x="32 44.112 54.944 59.408 63.872 74.784 82.8 87.104 95.12 112.032 121.6 126.064 130.528 134.832 141.168 151.328 161.488 165.952 173.968 178.272 187.84 198.736 209.648 213.952 228.336 234.784 239.248 245.584 255.376 263.392 267.696 277.264 288.176 298.336 309.168 315.792 320.096 326.72 337.616 347.408 364.32" y="113.336">Builds small tools and writes about them.</tspan></text></g></svg>
