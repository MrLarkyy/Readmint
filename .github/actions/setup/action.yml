name: Set up Node and pnpm
description: Install Node 22 and pnpm, restore the pnpm store cache, install the locked dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - run: corepack enable
      shell: bash
    - name: Download the pinned pnpm
      run: |
        for i in 1 2 3; do
          corepack install && exit 0
          sleep $((i * 5))
        done
        exit 1
      shell: bash
    - id: store
      name: Resolve the pnpm store path
      run: |
        store="$(pnpm store path --silent)"
        test -n "$store"
        echo "path=$store" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v6
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
