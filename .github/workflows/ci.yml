name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm -r build
      - run: pnpm --filter @readmint/action bundle
      - name: Action bundle smoke run
        shell: bash
        run: |
          grep -q "@license Unicode-3.0" packages/action/dist/action.js
          grep -q "^ \* Package: yaml@" packages/action/dist/action.js
          grep -q "^ \* Package: @resvg/resvg-wasm@" packages/action/dist/action.js
          grep -q "^ \* Package: wasm-webp@" packages/action/dist/action.js
          grep -q "Rust crates compiled into @resvg/resvg-wasm" packages/action/dist/action.js
          grep -q "Copyright (c) 2010, Google Inc" packages/action/dist/action.js
          grep -q "^ \* Package: gifenc@" packages/action/dist/action.js
          test -f packages/action/dist/wasm/resvg.wasm
          test -f packages/action/dist/wasm/webp.wasm
          work="$RUNNER_TEMP/readmint-smoke"
          cp -r packages/action/test/fixtures/smoke "$work"
          env "INPUT_DESIGNS=card.json" "INPUT_DATA-FILE=data.json" "INPUT_DRY-RUN=true" \
            "INPUT_FORMATS=svg,png,webp,gif" \
            "GITHUB_WORKSPACE=$work" "GITHUB_OUTPUT=$work/output.txt" \
            node packages/action/dist/action.js
          test -f "$work/readmint/card.svg"
          test -f "$work/readmint/card.dark.svg"
          test -f "$work/readmint/card.png"
          test -f "$work/readmint/card.webp"
          test -f "$work/readmint/card.gif"
          grep -q "^changed<<" "$work/output.txt"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: golden-results
          path: test-results/golden
          retention-days: 14
          if-no-files-found: ignore

  windows-paths:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project node packages/cli packages/action
