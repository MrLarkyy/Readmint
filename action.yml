name: Readmint
description: Render your Readmint designs to SVG, PNG, WebP, APNG or GIF and commit the files that changed.
author: MrLarkyy
branding:
  icon: image
  color: green

inputs:
  designs:
    description: Design files to render, one per line, relative to the workspace (at most 64). Required unless `manifest` is set; not with it. A `<name>.dark.<ext>` next to a design is rendered as its dark variant and wins over the `variant` input.
    required: false
  manifest:
    description: A render manifest, a JSON file of named renders `{ name, design, props, variants }` relative to the workspace (at most 64), instead of `designs`. Each render is written to `<output-dir>/<name>.<ext>` (and `<name>.dark.<ext>`); its designs lie in the manifest's folder; the `props-file` section named like a render applies to it.
    required: false
  output-dir:
    description: Folder inside the workspace the output files are written to; created when missing.
    required: false
    default: readmint
  formats:
    description: Output formats, comma or newline separated - svg, png, webp, apng, gif. Each design is written once per format; the README snippet shows the first. png and apng together are refused (both write .png).
    required: false
    default: svg
  scale:
    description: Raster pixels per design pixel, 1..4 (raster formats only).
    required: false
    default: "2"
  frame-rate:
    description: Frames per second of an animated raster output, 1..60 (gif 1..50); empty uses 30, gif 25, lowered to fit the raster limits.
    required: false
  quality:
    description: Lossy WebP at this quality, a whole number 1..100 (webp output only); empty keeps WebP lossless.
    required: false
  token:
    description: GitHub token for the GitHub data; not used with `data-file`, never printed and never given to git.
    required: false
    default: ${{ github.token }}
  login:
    description: GitHub login whose data is loaded; required with the workflow's GITHUB_TOKEN.
    required: false
    default: ${{ github.repository_owner }}
  exclude-repositories:
    description: Repositories (name or owner/name; comma or line separated) left out of every GitHub aggregate such as the languages; not with data-file.
    required: false
  language-commit-cap:
    description: Own commits (a whole number 0..2000; empty or 0 = off) read, one GitHub request each, to fill github.languagesAuthored with the lines you added per language; the run takes about 0.3-0.6 seconds per commit; with your own token it also counts private repositories (language names and sums only, no repository name); a slow run ends the reading early with a warning; not with data-file.
    required: false
  cache-dir:
    description: Folder outside the workspace (absolute, or relative to the workspace with ..; ~ is not expanded) where the GitHub load keeps its answers and the commits read between runs, and the data-wakatime and data-registry loads their stats and entries, so a later run sends no request for them, e.g. restored by actions/cache with a path under runner.temp; it never holds the token or a key; with data-file only together with data-wakatime or data-registry.
    required: false
  data-file:
    description: Fixture data JSON file (the CLI `--data` format) used instead of loading GitHub data; a file inside the workspace.
    required: false
  data-json:
    description: JSON documents to bind, one per line as `[<namespace>=]<source>` (the CLI `--data-json`; default namespace json, at most 8) - a file inside the workspace or an https URL; each is bound as `{ version, document }` under its namespace, added to the data-file or GitHub data.
    required: false
  data-json-headers:
    description: Headers for the data-json URLs, one per line as `<namespace>:<Header-Name>=<ENV_NAME>` - the value is read from the step's environment variable ENV_NAME (set it from a secret with `env:`), masked and never printed, and sent only to that URL's origin.
    required: false
  data-feed:
    description: RSS 2.0 or Atom 1.0 feeds to bind, one per line as `[<namespace>=]<https URL>` (the CLI `--data-feed`; default namespace feed, at most 8); each is bound as `{ version, title, link, entries }` with plain-text entries newest first, added after the data-json documents. A URL that holds a key must come from a secret (from a repository secret via the secrets context) - the runner prints the with values and masks only secrets. The Action itself never prints it.
    required: false
  data-feed-limits:
    description: Entries kept per feed, one per line as `<namespace>=<n>` with n from 1 to 50 (the CLI `--data-feed-limit`); a feed without a line keeps 5.
    required: false
  data-wakatime:
    description: WakaTime coding stats to bind, one per line as `[<namespace>=]<ENV_NAME>` (the CLI `--data-wakatime`; default namespace wakatime, at most 4) - ENV_NAME names the step environment variable that holds the API key. Keep the key in a repository secret and pass it in the workflow with `env` (WAKATIME_API_KEY set from the secrets context), then name the variable here, never the key; the Action masks it and sends it only to wakatime.com. Each is bound as `{ version, range, totalSeconds, humanReadableTotal, dailyAverageSeconds, languages, editors, operatingSystems }`, added after the feeds.
    required: false
  data-wakatime-ranges:
    description: Range per WakaTime source, one per line as `<namespace>=<range>` with range last_7_days, last_30_days, last_6_months, last_year or all_time (the CLI `--data-wakatime-range`); a source without a line takes last_7_days.
    required: false
  data-registry:
    description: Package registry entries to bind, one per line as `[<namespace>=]npm:<name>` or `[<namespace>=]maven:<group>:<artifact>` (the CLI `--data-registry`; default namespace registry, at most 20 npm and 20 Maven entries per namespace and 4 namespaces); no key is involved. Each namespace is bound as `{ version, npm, maven }` with `npm` entries `{ name, version, weeklyDownloads }` and `maven` entries `{ group, artifact, latestVersion, updated }` in the order given, `null` for an entry the registry does not know (with a warning); only registry.npmjs.org, api.npmjs.org and repo1.maven.org are contacted. Added after the WakaTime sources.
    required: false
  props-file:
    description: Settings JSON file (the CLI `--props` format, root component props by section) merged into every listed design and its dark twin, for texts set once per template; a path relative to the workspace, confined to it like data-file (no .., no absolute path, no link leading outside).
    required: false
  variant:
    description: Also render each listed design as this named variant from the same file; `dark` sets its root prop theme to dark and writes `<stem>.dark.<ext>`. Empty (default) renders none. A `<stem>.dark.<ext>` design next to it wins.
    required: false
  locale:
    description: BCP 47 tag for the number and date filters, checked as the CLI `--locale`; empty uses the design's locale, else en.
    required: false
  commit-message:
    description: Message of the commit with the changed files (at most 4096 characters).
    required: false
    default: Update Readmint graphics
  branch:
    description: Branch the commit is pushed to (empty, the checked-out branch); the checkout must be its latest commit on origin.
    required: false
  dry-run:
    description: "`true` renders and writes the files but runs no git command: no commit, no push."
    required: false
    default: "false"

outputs:
  changed:
    description: "`true` when any output differs from the last commit (in a dry run: from the files in the workspace)."
  commit:
    description: SHA of the pushed commit; empty when nothing was committed.
  files:
    description: The changed output files, one per line, relative to the workspace.
  snippet:
    description: "`<picture>` HTML showing every design, with the dark variant where there is one, for the README."

runs:
  using: node24
  main: packages/action/dist/action.js
